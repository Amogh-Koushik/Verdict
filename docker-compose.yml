x-app: &app
  build: .
  image: verdict-app
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://verdict:verdict@db:5432/verdict
    REDIS_URL: redis://redis:6379/0
    PROBLEMS_DIR: /data/problems

services:
  db:
    image: postgres:16
    # Explicit grace periods everywhere: a host's default stop timeout can be shorter than 10 s.
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
      POSTGRES_DB: verdict
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict -d verdict"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    stop_grace_period: 10s
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    # Uvicorn gives open requests up to 5 s to finish before it cancels them and exits.
    stop_grace_period: 15s
    ports:
      - "8000:8000"
    volumes:
      - problems:/data/problems
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "verdict.judge"]
    # On SIGTERM the worker has 10 s to finish, then gives its submission back; Docker's
    # default 10 s before SIGKILL would cut that hand-back off.
    stop_grace_period: 20s
    # The socket's group differs by host: 0 on Docker Desktop, the docker group's id on Linux.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - problems:/data/problems:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  problems:
