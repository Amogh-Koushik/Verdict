# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Set POSTGRES_PASSWORD and VERDICT_DOMAIN in .env first (see .env.example).
x-database-url: &database-url postgresql+psycopg://verdict:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/verdict

services:
  db:
    restart: unless-stopped
    # Only the other services reach Postgres and Redis, over the Compose network.
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    restart: unless-stopped
    ports: !reset []

  migrate:
    # A one-shot job: any other policy would run the migrations again every time they finish.
    restart: "no"
    environment:
      DATABASE_URL: *database-url

  web:
    restart: unless-stopped
    # Reached only through Caddy.
    ports: !reset []
    networks:
      - default
      - edge
    environment:
      DATABASE_URL: *database-url
      SESSION_COOKIE_SECURE: "true"
      # Uvicorn believes X-Forwarded-For (the client's address, which the login rate limit
      # counts by) and X-Forwarded-Proto only from this address: Caddy's, on the edge network.
      FORWARDED_ALLOW_IPS: 10.89.250.2

  worker:
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Caddy's own grace period for open streams is 5 s (see Caddyfile).
    stop_grace_period: 15s
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      edge:
        ipv4_address: 10.89.250.2
    environment:
      VERDICT_DOMAIN: ${VERDICT_DOMAIN:?set VERDICT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

networks:
  # Caddy and web only. Caddy's address is fixed, outside the range Docker hands out, so web
  # can't take it first. If 10.89.250.0/28 clashes with a network on the server, change the
  # subnet, the range and both addresses above together.
  edge:
    ipam:
      config:
        - subnet: 10.89.250.0/28
          ip_range: 10.89.250.8/29

volumes:
  caddy_data:
  caddy_config:
